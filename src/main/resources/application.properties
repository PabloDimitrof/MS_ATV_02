spring.application.name=login-service
server.port=8080

# Banco H2 em memoria
spring.datasource.url=jdbc:h2:mem:logindb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# As tabelas sao criadas pelo data.sql (o Hibernate nao gera o schema)
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.jpa.open-in-view=false

# Actuator: expoe o endpoint usado pelo Prometheus
management.endpoints.web.exposure.include=health,info,metrics,prometheus

# Regra de bloqueio: "falhou mais de uma vez" = bloqueia na 2a falha
app.login.tentativas-para-bloqueio=2
