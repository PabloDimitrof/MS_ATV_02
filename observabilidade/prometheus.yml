global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'login-service'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 5s
    static_configs:
      # Prometheus rodando via Docker (docker compose): use host.docker.internal
      # Prometheus instalado direto no Windows: troque para "localhost:8080"
      - targets: ['host.docker.internal:8080']
